name: E2E Tests

# The suite tests the kids-stories preview only, and turbo-ignore (PR #76)
# skips the kids-stories Vercel build on PRs that don't affect it — waiting
# for that preview on unrelated PRs times out against a deployment that never
# happens. "E2E Tests" is a REQUIRED check on main, so the workflow must
# always trigger (a path-filtered workflow never reports and blocks the merge
# forever); instead a filter job gates the real work, and the skipped jobs
# report a conclusion GitHub counts as passing.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: e2e-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect kids-stories changes
    runs-on: ubuntu-latest
    outputs:
      kids: ${{ steps.filter.outputs.kids }}
    steps:
      - name: Check paths that reach kids-stories
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            kids:
              - 'apps/kids-stories/**'
              - 'packages/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

  wait-for-preview:
    name: Wait for Vercel preview
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kids == 'true'
    outputs:
      preview_url: ${{ steps.wait.outputs.url }}
    steps:
      - name: Wait for Vercel preview deployment
        id: wait
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          environment: 'Preview – mystudio-kids-stories'
          check_interval: 10

  playwright:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [changes, wait-for-preview]
    if: needs.changes.outputs.kids == 'true'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ needs.wait-for-preview.outputs.preview_url }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  report:
    name: Post test summary
    runs-on: ubuntu-latest
    needs: [changes, playwright]
    if: always() && needs.changes.outputs.kids == 'true'
    permissions:
      pull-requests: write
    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
        continue-on-error: true

      - name: Post PR comment
        uses: daun/playwright-report-summary@v3
        with:
          report-file: playwright-report/results.json
          comment-title: "E2E Test Results"
          icon-style: octicons
        continue-on-error: true
